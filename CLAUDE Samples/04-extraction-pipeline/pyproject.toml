[project]
name = "health-extraction"
version = "0.1.0"
description = "Extraction pipeline practice: strict schema, validation-retry loop, human review routing"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.70", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
health-extract = "extraction.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
