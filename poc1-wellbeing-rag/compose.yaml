services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poc1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc1_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-wellbeing_rag}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - poc1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poc1} -d ${POSTGRES_DB:-wellbeing_rag}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  poc1_postgres_data:
